name: Android native alpha
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-sm-t510]
  pull_request:
    paths: ['android/**', '.github/workflows/android-native.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generator dependencies
        run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.3.5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Native engine and session tests
        run: sh android/test.sh
      - name: Permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (forks, first setup) build.py generates a throwaway key.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p build/android-signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/android-signing/debug.keystore
            echo "Using the permanent signing key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this APK will not update over earlier installs"
          fi
      - name: Build and verify ARM APK (32- and 64-bit)
        run: python3 android/build.py
      - name: Package corresponding source
        run: git archive --format=zip --output=build/android/Paleotone-Android-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Paleotone-Android-alpha
          path: |
            build/android/Paleotone-Android-0.4.0-alpha.apk
            build/android/SHA256SUMS
            build/android/Paleotone-Android-source.zip
          retention-days: 30
